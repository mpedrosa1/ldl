# Documentação completa: https://www.zigbee2mqtt.io/guide/configuration/

homeassistant:
  enabled: true

mqtt:
  server: "mqtt://mosquitto:1883"
  user: zigbee2mqtt
  password: "TROQUE_ESTA_SENHA" # mesmo usuário/senha criados com mosquitto_passwd

serial:
  # Ajuste para o caminho real do seu coordenador Zigbee (veja README).
  port: /dev/ttyUSB0

frontend:
  port: 8080

advanced:
  network_key: GENERATE
  log_level: info
